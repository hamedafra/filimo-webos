<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Filimo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #ddd; }
      body { display: flex; align-items: center; justify-content: center;
             font: 32px sans-serif; text-align: center; }
      #msg { display: none; }
    </style>
  </head>
  <body>
    <div id="msg">
      اتصال به اینترنت برقرار نیست.<br />
      دکمه‌ی OK را برای تلاش دوباره بزنید.
    </div>
    <script>
      // Filimo's TV web app; it already supports webOS (Back key 461, webOSTV.js).
      var TARGET = 'https://tv.filimo.com/';

      function go() {
        if (navigator.onLine === false) {
          document.getElementById('msg').style.display = 'block';
          return;
        }
        window.location.replace(TARGET);
      }

      document.addEventListener('keydown', function (e) {
        if (e.keyCode === 13) go();
        // Back on this local page exits the app.
        if (e.keyCode === 461) window.close();
      });
      window.addEventListener('online', go);

      go();
    </script>
  </body>
</html>
